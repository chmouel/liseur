<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <!-- Liseur banner mark: a woman stretched out on a sofa, reading in the breeze -->
  <circle cx="54" cy="54" r="50" fill="#F0DCC6"/>

  <!-- sofa backrest, low, behind her -->
  <path d="M18 52 C18 47 21 44 26 44 L84 44 C89 44 92 47 92 52 L92 68 L18 68 Z"
        fill="#3A5F5C" opacity="0.25"/>

  <!-- left armrest, the head end, a little taller -->
  <path d="M12 50 C12 45.5 15 43 19 43 C23 43 26 45.5 26 50 L26 76 C26 78 24.5 79 22.5 79 L15.5 79 C13.5 79 12 78 12 76 Z"
        fill="#356057"/>
  <!-- seat -->
  <path d="M22 64 C22 61 24.5 59 28 59 L88 59 C91.5 59 94 61 94 64 L94 74 C94 77 92 79 89 79 L27 79 C24 79 22 77 22 74 Z"
        fill="#3A5F5C"/>
  <!-- right armrest -->
  <path d="M86 54 C86 50.5 88.5 48.5 91.5 48.5 C94.5 48.5 96 50.5 96 54 L96 76 C96 78 94.5 79 93 79 L89 79 C87 79 86 78 86 76 Z"
        fill="#356057"/>
  <!-- legs of the sofa -->
  <rect x="20" y="79" width="3.2" height="6" rx="1.5" fill="#5C3018"/>
  <rect x="88" y="79" width="3.2" height="6" rx="1.5" fill="#5C3018"/>

  <!-- her body, lying along the seat: one soft band from shoulders to hips -->
  <path d="M36 62
           C42 57.5 52 56.5 60 58.5
           C64 59.5 66 61.5 66 64
           L66 68 L36 68 Z" fill="#8B5E3C"/>

  <!-- bent knees rising, shins back down to the cushion -->
  <path d="M60 68
           C61 60 65 52.5 70 49
           C72.5 47.3 75.5 48.2 76 51
           C76.5 54 74 56 72.5 58.5
           C70.5 61.5 69.5 64.5 69.5 68 Z" fill="#8B5E3C"/>

  <!-- head resting on the armrest, face up -->
  <circle cx="27.5" cy="51" r="9" fill="#8B5E3C"/>
  <!-- auburn hair: crown spilling toward the armrest, loose bun -->
  <path d="M21 45.5
           C23 40.5 29 38.5 33.5 41.5
           C37 43.8 38 48.5 36 52.5
           C35.5 48.5 33 45.6 29.5 45
           L25.5 44.6 Z" fill="#7A4A2B"/>
  <circle cx="18.5" cy="47" r="4.8" fill="#7A4A2B"/>
  <!-- a strand lifted by the breeze -->
  <path d="M20 42 C17 39 16.5 35.5 18.5 32.5 C18 35.5 19.5 38.5 22.5 40.5 Z" fill="#7A4A2B" opacity="0.85"/>

  <!-- closed eye and soft smile, in profile looking up at the book -->
  <path d="M28.5 49.5 Q30.3 51 32 49.5" fill="none" stroke="#5C3018" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M30 56 Q31.8 57 33.4 55.8" fill="none" stroke="#5C3018" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

  <!-- open book, resting against her thighs, facing her -->
  <g transform="rotate(-18 56 44)">
    <path d="M42 42 C48 38.7 53.5 38.7 56 41 L56 54 C53.5 51.7 48.5 51.7 42 55 Z"
          fill="#FFFFFF" stroke="#5C3018" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="M56 41 C58.5 38.7 64 38.7 70 42 L70 55 C63.5 51.7 58.5 51.7 56 54 Z"
          fill="#FFFFFF" stroke="#5C3018" stroke-width="1.9" stroke-linejoin="round"/>
    <line x1="56" y1="41" x2="56" y2="54" stroke="#5C3018" stroke-width="1.4"/>
    <!-- faint lines of text -->
    <g stroke="#5C3018" stroke-width="1" stroke-linecap="round" opacity="0.4">
      <path d="M45 44.6 C48.5 43.2 51.5 43 53.4 44"/>
      <path d="M45 47.8 C48.5 46.4 51.5 46.2 53.4 47.2"/>
      <path d="M58.6 44 C60.5 43 63.5 43.2 67 44.6"/>
      <path d="M58.6 47.2 C60.5 46.2 63.5 46.4 67 47.8"/>
    </g>
  </g>
  <!-- arm reaching up to hold the book -->
  <path d="M38 62 C40 56 43.5 51 47.5 48.5" fill="none" stroke="#8B5E3C" stroke-width="5" stroke-linecap="round"/>
  <circle cx="48.5" cy="48" r="3" fill="#8B5E3C"/>

  <!-- the breeze: curling air with leaves riding it -->
  <g fill="none" stroke="#3A5F5C" stroke-width="1.7" stroke-linecap="round" opacity="0.75">
    <path d="M60 24 C68 21 74 21.5 79 25"/>
    <path d="M64 32 C70 29.5 74.5 30 78 32.5"/>
    <path d="M28 26 C34 23 40 23.5 45 27"/>
  </g>
  <g fill="#3A5F5C" opacity="0.9">
    <ellipse cx="81.5" cy="23.5" rx="2.5" ry="1.35" transform="rotate(-25 81.5 23.5)"/>
    <ellipse cx="47" cy="25.5" rx="2.2" ry="1.2" transform="rotate(-30 47 25.5)"/>
    <ellipse cx="80" cy="34" rx="1.9" ry="1.05" transform="rotate(20 80 34)"/>
  </g>
</svg>
