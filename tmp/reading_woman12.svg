  <ellipse cx="85" cy="66" rx="3.1" ry="1.9" transform="rotate(-20 85 66)" fill="#F2BE9A"/>
  <ellipse cx="87" cy="69.6" rx="3.1" ry="1.9" transform="rotate(-6 87 69.6)" fill="#F2BE9A"/>

  <!-- torso -->
  <path d="M28 52
           C28 46 32 42.5 37 43.5
           C41 44.3 43.5 48 43 53
           C42.5 58 40 62 38 66
           L30 66
           C28.5 62 27.5 56 28 52 Z" fill="#FFF8EF"/>

  <!-- neck + bigger head -->
  <rect x="33 " y="38.5" width="8" height="9" rx="3.6" fill="#F2BE9A"/>
  <circle cx="37" cy="28" r="12" fill="#F2BE9A"/>

  <!-- Roman hair: center part, soft waves framing the face, low chignon at the nape -->
  <path d="M25.2 28
           C24.6 19.5 30 14.2 37 14.2
           C44 14.2 49.4 19.5 48.8 28
           C48.3 25 47.2 22.8 45.6 21.4
           C46 24.6 45.4 27.2 44 29.4
           C44.4 25.4 43.4 22.4 41 20.6
           C39.8 19.7 38.4 19.2 37 19.2
           C35.6 19.2 34.2 19.7 33 20.6
           C30.6 22.4 29.6 25.4 30 29.4
           C28.6 27.2 28 24.6 28.4 21.4
           C26.8 22.8 25.7 25 25.2 28 Z" fill="#E9C46A"/>
  <!-- braided band over the crown -->
  <path d="M27 21.5 C29.8 16.8 33.2 14.6 37 14.6 C40.8 14.6 44.2 16.8 47 21.5"
        fill="none" stroke="#D9A83F" stroke-width="2.6" stroke-linecap="round"/>
  <g fill="#E9C46A">
    <circle cx="29.2" cy="19.8" r="1.7"/>
    <circle cx="32" cy="17.4" r="1.7"/>
    <circle cx="35.2" cy="16.2" r="1.7"/>
    <circle cx="38.8" cy="16.2" r="1.7"/>
    <circle cx="42" cy="17.4" r="1.7"/>
    <circle cx="44.8" cy="19.8" r="1.7"/>
  </g>
  <!-- low chignon at the nape -->
  <circle cx="25" cy="36.5" r="4.4" fill="#E9C46A"/>
  <circle cx="25" cy="36.5" r="4.4" fill="none" stroke="#D9A83F" stroke-width="1.1" opacity="0.7"/>
  <path d="M22.5 34 C23.8 36.6 23.8 38.6 23 40.5" fill="none" stroke="#D9A83F" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
  <!-- loose tendril in the breeze -->
  <path d="M46.5 17.5 C50.5 15.2 54.5 15.6 57 18 C54.2 17.2 50.8 17.9 48.4 19.9 Z" fill="#E9C46A" opacity="0.85"/>
  <path d="M44.5 33 C45.8 35 45.8 37.2 44.6 39.2" fill="none" stroke="#E9C46A" stroke-width="1.6" stroke-linecap="round"/>

  <!-- face: closed lashes, soft smile, no blush -->
  <path d="M31 29.4 Q33.2 31.6 35.4 29.4" fill="none" stroke="#5C3018" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M38.6 29.4 Q40.8 31.6 43 29.4" fill="none" stroke="#5C3018" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M35.1 35.6 Q37 37.2 38.9 35.6" fill="none" stroke="#5C3018" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>

  <!-- open book on her lap -->
  <g transform="rotate(-10 52 52)">
    <path d="M38 50 C44 46.7 49.5 46.7 52 49 L52 62 C49.5 59.7 44.5 59.7 38 63 Z"
          fill="#FFFFFF" stroke="#5C3018" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="M52 49 C54.5 46.7 60 46.7 66 50 L66 63 C59.5 59.7 54.5 59.7 52 62 Z"
          fill="#FFFFFF" stroke="#5C3018" stroke-width="1.9" stroke-linejoin="round"/>
    <line x1="52" y1="49" x2="52" y2="62" stroke="#5C3018" stroke-width="1.4"/>
    <g stroke="#5C3018" stroke-width="1" stroke-linecap="round" opacity="0.4">
      <path d="M41 52.6 C44.5 51.2 47.5 51 49.4 52"/>
      <path d="M41 55.8 C44.5 54.4 47.5 54.2 49.4 55.2"/>
      <path d="M54.6 52 C56.5 51 59.5 51.2 63 52.6"/>
      <path d="M54.6 55.2 C56.5 54.2 59.5 54.4 63 55.8"/>
    </g>
  </g>
  <circle cx="40" cy="61.5" r="2.9" fill="#F2BE9A"/>
  <circle cx="64" cy="59.5" r="2.9" fill="#F2BE9A"/>

  <!-- breeze -->
  <g fill="none" stroke="#3A5F5C" stroke-width="1.7" stroke-linecap="round" opacity="0.75">
    <path d="M58 22 C66 19 72 19.5 77 23"/>
    <path d="M62 30 C68 27.5 72.5 28 76 30.5"/>
    <path d="M70 38 C75 36 79 36.4 82 38.5"/>
  </g>
  <g fill="#3A5F5C" opacity="0.9">
    <ellipse cx="79.5" cy="21.5" rx="2.5" ry="1.35" transform="rotate(-25 79.5 21.5)"/>
    <ellipse cx="78" cy="31.5" rx="2.1" ry="1.15" transform="rotate(20 78 31.5)"/>
    <ellipse cx="84" cy="39.5" rx="1.9" ry="1.05" transform="rotate(-30 84 39.5)"/>
  </g>
</svg>
