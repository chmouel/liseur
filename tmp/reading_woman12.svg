<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <circle cx="54" cy="54" r="50" fill="#F0DCC6"/>

  <!-- sofa backrest -->
  <path d="M18 54 C18 49 21 46 26 46 L84 46 C89 46 92 49 92 54 L92 70 L18 70 Z"
        fill="#3A5F5C" opacity="0.25"/>
