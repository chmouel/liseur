<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <!-- Woman reading in peace — elegant one-weight line art -->
  <circle cx="54" cy="54" r="50" fill="#F0DCC6"/>

  <g fill="none" stroke="#5C3018" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- back and seat: one calm sweeping curve, sitting cross-legged -->
    <path d="M38 78
             C33 70 33 58 38 49
             C41 43 45 38 50 35"/>
    <!-- head in profile, bowed to the page -->
    <path d="M50 35
             C49 30 52 25.5 57 25
             C62 24.5 66 28 66.5 33
             C67 37.5 64 41.5 59.5 42.5"/>
    <!-- nape into shoulder, arm reaching to the book -->
    <path d="M59.5 42.5 C59 48 61 53 64 57"/>
    <!-- folded legs -->
    <path d="M38 78 C46 74 58 74 66 78"/>
    <!-- open book -->
    <path d="M52 62 C57 58.5 62 58.5 66 61 L66 70 C62 67.5 57 67.5 52 71 Z"/>
    <path d="M66 61 C70 58.5 75 58.5 80 62 L80 71 C75 67.5 70 67.5 66 70 Z"/>
    <path d="M66 61 L66 70"/>
    <!-- knee supporting the book -->
    <path d="M44 74 C46 68 49 64 52 62"/>
  </g>

  <!-- hair bun, filled -->
  <circle cx="52" cy="24.5" r="5" fill="#5C3018"/>

  <!-- a leaf of quiet, teal accent -->
  <g fill="#3A5F5C" opacity="0.9">
    <ellipse cx="31" cy="34" rx="3" ry="1.6" transform="rotate(-35 31 34)"/>
    <ellipse cx="26" cy="43" rx="2.4" ry="1.3" transform="rotate(25 26 43)"/>
  </g>
</svg>
