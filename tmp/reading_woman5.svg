<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <!-- Liseur banner mark: a woman reading in peace -->
  <circle cx="54" cy="54" r="50" fill="#F0DCC6"/>

  <!-- torso -->
  <path d="M36 80 C36 65 44 57 54 57 C64 57 72 65 72 80 Z" fill="#8B5E3C"/>
  <!-- neck -->
  <rect x="50" y="46" width="8" height="10" rx="3.5" fill="#8B5E3C"/>
  <!-- head -->
  <circle cx="54" cy="35" r="11" fill="#8B5E3C"/>

  <!-- hair cap + bun -->
  <path d="M42.8 36
           C42.3 27.5 47.3 22.4 54 22.4
           C60.7 22.4 65.7 27.5 65.2 36
           C64.6 31 61.8 28 58.3 27.2
           L54 26.4 L49.7 27.2
           C46.2 28 43.4 31 42.8 36 Z" fill="#15110C"/>
  <circle cx="54" cy="19.5" r="5.6" fill="#15110C"/>

  <!-- closed eyes -->
  <path d="M48 37 Q49.9 38.9 51.8 37" fill="none" stroke="#15110C" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M56.2 37 Q58.1 38.9 60 37" fill="none" stroke="#15110C" stroke-width="1.6" stroke-linecap="round"/>
  <!-- soft smile -->
  <path d="M52.4 42.6 Q54 43.9 55.6 42.6" fill="none" stroke="#15110C" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>

  <!-- open book held before her -->
  <path d="M35 61.5 C43 57 50.5 57 54 60 L54 78 C50.5 75 43.5 75 35 79.5 Z"
        fill="#FFFFFF" stroke="#5C3018" stroke-width="2" stroke-linejoin="round"/>
  <path d="M54 60 C57.5 57 65 57 73 61.5 L73 79.5 C64.5 75 57.5 75 54 78 Z"
        fill="#FFFFFF" stroke="#5C3018" stroke-width="2" stroke-linejoin="round"/>
  <line x1="54" y1="60" x2="54" y2="78" stroke="#5C3018" stroke-width="1.6"/>
  <!-- hands at the book's outer edges -->
  <circle cx="36.5" cy="70" r="3.4" fill="#8B5E3C"/>
  <circle cx="71.5" cy="70" r="3.4" fill="#8B5E3C"/>
  <!-- faint text lines -->
  <g stroke="#5C3018" stroke-width="1.1" stroke-linecap="round" opacity="0.4">
    <path d="M39.5 64.5 C44 62.6 48 62.4 50.6 63.7"/>
    <path d="M39.5 68.4 C44 66.5 48 66.3 50.6 67.6"/>
    <path d="M57.4 63.7 C60 62.4 64 62.6 68.5 64.5"/>
    <path d="M57.4 67.6 C60 66.3 64 66.5 68.5 68.4"/>
  </g>

  <!-- drifting leaves -->
  <g fill="#3A5F5C" opacity="0.9">
    <ellipse cx="30" cy="33" rx="3" ry="1.6" transform="rotate(-35 30 33)"/>
    <ellipse cx="80" cy="39" rx="2.4" ry="1.3" transform="rotate(25 80 39)"/>
    <ellipse cx="26" cy="44" rx="2.1" ry="1.15" transform="rotate(20 26 44)"/>
  </g>
</svg>
