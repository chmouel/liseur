<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <!-- Liseur banner mark: a woman reading in peace on a sofa, breeze drifting by -->
  <circle cx="54" cy="54" r="50" fill="#F0DCC6"/>

  <!-- sofa: back cushion -->
  <path d="M22 52 C22 46 26 42 32 42 L76 42 C82 42 86 46 86 52 L86 66 L22 66 Z"
        fill="#3A5F5C" opacity="0.28"/>
  <!-- sofa: seat -->
  <path d="M20 66 C20 62 23 60 27 60 L81 60 C85 60 88 62 88 66 L88 74 C88 77 86 79 83 79 L25 79 C22 79 20 77 20 74 Z"
        fill="#3A5F5C"/>
  <!-- armrests -->
  <path d="M14 58 C14 54 17 52 20 52 C23 52 26 54 26 58 L26 76 C26 78 24 79 22 79 L18 79 C16 79 14 78 14 76 Z" fill="#356057"/>
  <path d="M82 58 C82 54 85 52 88 52 C91 52 94 54 94 58 L94 76 C94 78 92 79 90 79 L86 79 C84 79 82 78 82 76 Z" fill="#356057"/>
  <!-- sofa legs -->
  <rect x="24" y="79" width="3.4" height="6" rx="1.6" fill="#5C3018"/>
  <rect x="80.5" y="79" width="3.4" height="6" rx="1.6" fill="#5C3018"/>

  <!-- torso, settled into the seat -->
  <path d="M38 72 C38 58 45 51 54 51 C63 51 70 58 70 72 Z" fill="#8B5E3C"/>
  <!-- neck -->
  <rect x="50" y="41" width="8" height="9" rx="3.5" fill="#8B5E3C"/>
  <!-- head -->
  <circle cx="54" cy="30" r="10.5" fill="#8B5E3C"/>

  <!-- hair cap + bun, warm auburn rather than black -->
  <path d="M43.2 31
           C42.7 23 47.5 18 54 18
           C60.5 18 65.3 23 64.8 31
           C64.2 26.3 61.5 23.5 58.2 22.7
           L54 22 L49.8 22.7
           C46.5 23.5 43.8 26.3 43.2 31 Z" fill="#7A4A2B"/>
  <circle cx="54" cy="15.5" r="5.2" fill="#7A4A2B"/>
  <!-- a strand lifted by the breeze -->
  <path d="M59 15 C63 13 67 13.5 70 16 C67 15 63.5 15.6 61 17.5 Z" fill="#7A4A2B" opacity="0.85"/>

  <!-- closed eyes -->
  <path d="M48.4 32 Q50.2 33.8 52 32" fill="none" stroke="#5C3018" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M56 32 Q57.8 33.8 59.6 32" fill="none" stroke="#5C3018" stroke-width="1.6" stroke-linecap="round"/>
  <!-- soft smile -->
  <path d="M52.5 37.2 Q54 38.4 55.5 37.2" fill="none" stroke="#5C3018" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>

  <!-- open book held before her -->
  <path d="M36.5 55.5 C44 51.5 51 51.5 54 54.2 L54 70 C51 67.3 44.5 67.3 36.5 71.5 Z"
        fill="#FFFFFF" stroke="#5C3018" stroke-width="2" stroke-linejoin="round"/>
  <path d="M54 54.2 C57 51.5 64 51.5 71.5 55.5 L71.5 71.5 C63.5 67.3 57 67.3 54 70 Z"
        fill="#FFFFFF" stroke="#5C3018" stroke-width="2" stroke-linejoin="round"/>
  <line x1="54" y1="54.2" x2="54" y2="70" stroke="#5C3018" stroke-width="1.6"/>
  <!-- hands at the book's outer edges -->
  <circle cx="38" cy="63" r="3.2" fill="#8B5E3C"/>
  <circle cx="70" cy="63" r="3.2" fill="#8B5E3C"/>
  <!-- faint text lines -->
  <g stroke="#5C3018" stroke-width="1.1" stroke-linecap="round" opacity="0.4">
    <path d="M40.5 58 C44.5 56.3 48 56.1 50.6 57.3"/>
    <path d="M40.5 61.6 C44.5 59.9 48 59.7 50.6 60.9"/>
    <path d="M57.4 57.3 C60 56.1 63.5 56.3 67.5 58"/>
    <path d="M57.4 60.9 C60 59.7 63.5 59.9 67.5 61.6"/>
  </g>

  <!-- the breeze: curling air lines with a leaf or two riding it -->
  <g fill="none" stroke="#3A5F5C" stroke-width="1.7" stroke-linecap="round" opacity="0.75">
    <path d="M18 30 C26 27 32 27.5 37 31"/>
    <path d="M22 38 C28 35.5 32.5 36 36 38.5"/>
    <path d="M70 24 C76 21 82 21.5 87 25"/>
    <path d="M73 33 C78 30.5 82.5 31 86 33.5"/>
  </g>
  <g fill="#3A5F5C" opacity="0.9">
    <ellipse cx="39" cy="29.5" rx="2.6" ry="1.4" transform="rotate(-30 39 29.5)"/>
    <ellipse cx="88.5" cy="23.5" rx="2.3" ry="1.25" transform="rotate(-25 88.5 23.5)"/>
    <ellipse cx="20" cy="44" rx="2" ry="1.1" transform="rotate(20 20 44)"/>
  </g>
</svg>
