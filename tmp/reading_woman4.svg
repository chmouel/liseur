<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <!-- Woman reading in peace — serene front view -->
  <circle cx="54" cy="54" r="50" fill="#F0DCC6"/>

  <!-- shoulders / torso -->
  <path d="M34 82 C34 66 42 57 54 57 C66 57 74 66 74 82 Z" fill="#8B5E3C"/>

  <!-- neck -->
  <rect x="50" y="46" width="8" height="10" rx="3.5" fill="#8B5E3C"/>

  <!-- head -->
  <circle cx="54" cy="35" r="11" fill="#8B5E3C"/>

  <!-- hair: soft cap with middle part + top bun -->
  <path d="M43.5 35
           C43 27.5 47.5 22.8 54 22.8
           C60.5 22.8 65 27.5 64.5 35
           C64.5 31 62 27.8 58.5 27
           L54 26.2 L49.5 27
           C46 27.8 43.5 31 43.5 35 Z" fill="#15110C"/>
  <circle cx="54" cy="20" r="5.4" fill="#15110C"/>
  <!-- hair falling at the sides -->
  <path d="M43.5 34 C42.6 38 43 42 44.6 45 C42 43 41 38 42 33.6 Z" fill="#15110C"/>
  <path d="M64.5 34 C65.4 38 65 42 63.4 45 C66 43 67 38 66 33.6 Z" fill="#15110C"/>

  <!-- closed eyes, reading in peace -->
  <path d="M48.2 36.6 Q50 38.4 51.8 36.6" fill="none" stroke="#15110C" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M56.2 36.6 Q58 38.4 59.8 36.6" fill="none" stroke="#15110C" stroke-width="1.5" stroke-linecap="round"/>

  <!-- open book held before her -->
  <path d="M36 62 C44 57.5 51 57.5 54 60.5 L54 78 C51 75 44 75 36 79.5 Z"
        fill="#FFFFFF" stroke="#5C3018" stroke-width="2" stroke-linejoin="round"/>
  <path d="M54 60.5 C57 57.5 64 57.5 72 62 L72 79.5 C64 75 57 75 54 78 Z"
        fill="#FFFFFF" stroke="#5C3018" stroke-width="2" stroke-linejoin="round"/>
  <line x1="54" y1="60.5" x2="54" y2="78" stroke="#5C3018" stroke-width="1.6"/>
  <!-- faint text lines -->
  <g stroke="#5C3018" stroke-width="1.1" stroke-linecap="round" opacity="0.45">
    <path d="M40 64.5 C44.5 62.5 48.5 62.2 51 63.6"/>
    <path d="M40 68.5 C44.5 66.5 48.5 66.2 51 67.6"/>
    <path d="M57 63.6 C59.5 62.2 63.5 62.5 68 64.5"/>
    <path d="M57 67.6 C59.5 66.2 63.5 66.5 68 68.5"/>
  </g>

  <!-- drifting leaves, teal accent -->
  <g fill="#3A5F5C" opacity="0.9">
    <ellipse cx="30" cy="34" rx="3" ry="1.6" transform="rotate(-35 30 34)"/>
    <ellipse cx="79" cy="40" rx="2.4" ry="1.3" transform="rotate(25 79 40)"/>
    <ellipse cx="26" cy="45" rx="2.1" ry="1.15" transform="rotate(20 26 45)"/>
  </g>
</svg>
