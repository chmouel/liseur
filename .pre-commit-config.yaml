default_install_hook_types: ["pre-push"]
repos:
  - repo: local
    hooks:
      - id: unit-tests
        name: Unit tests (testFossDebugUnitTest testPlayDebugUnitTest)
        entry: ./gradlew testFossDebugUnitTest testPlayDebugUnitTest --console=plain --daemon
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: '^(app/|gradle/|gradlew$|gradlew\.bat$|.*\.gradle\.kts$|gradle\.properties$)'
      - id: lint
        name: Android Lint (lintFossDebug lintPlayDebug)
        entry: ./gradlew lintFossDebug lintPlayDebug --console=plain --daemon
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: '^(app/|gradle/|gradlew$|gradlew\.bat$|.*\.gradle\.kts$|gradle\.properties$)'
      # - id: assemble-release
      #   name: Release build (assembleFossRelease)
      #   entry: ./gradlew assembleFossRelease --console=plain --daemon
      #   language: system
      #   pass_filenames: false
      #   stages: [pre-push]
