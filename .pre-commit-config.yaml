default_install_hook_types: ["pre-push"]
repos:
  - repo: local
    hooks:
      - id: unit-tests
        name: Unit tests (testDebugUnitTest)
        entry: ./gradlew testDebugUnitTest --console=plain --daemon
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: '^(app/|gradle/|gradlew$|gradlew\.bat$|.*\.gradle\.kts$|gradle\.properties$)'
      - id: lint
        name: Android Lint (lintDebug)
        entry: ./gradlew lintDebug --console=plain --daemon
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: '^(app/|gradle/|gradlew$|gradlew\.bat$|.*\.gradle\.kts$|gradle\.properties$)'
      # - id: assemble-release
      #   name: Release build (assembleRelease)
      #   entry: ./gradlew assembleRelease --console=plain --daemon
      #   language: system
      #   pass_filenames: false
      #   stages: [pre-push]
