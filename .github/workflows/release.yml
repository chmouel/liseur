name: Release

# The tag is the trigger, not the GitHub release: a published release is
# immutable, so the APK has to be attached at the moment the release is
# created rather than uploaded to it afterwards.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The notes are written from the commits since the previous
          # tag, so the whole history and every tag has to be here.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]]
          version="${RELEASE_TAG#v}"
          grep -Fq "versionName = \"$version\"" app/build.gradle.kts
          version_code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)$/\1/p' \
            app/build.gradle.kts)
          test -s "fastlane/metadata/android/en-US/changelogs/$version_code.txt"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.LISEUR_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LISEUR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LISEUR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LISEUR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/liseur-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Verify release APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          release_apk="app/build/outputs/apk/release/liseur-${RELEASE_TAG}.apk"
          mv "$apk" "$release_apk"
          printf 'RELEASE_APK=%s\n' "$release_apk" >> "$GITHUB_ENV"

      - name: Write the release notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          hack/generate-release-notes --output "$RUNNER_TEMP/notes.md" \
            "$RELEASE_TAG"
          printf 'RELEASE_NOTES=%s\n' "$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Release %s already exists.\n' "$RELEASE_TAG"
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Liseur $RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES" \
            "$RELEASE_APK"

      # Everything below is Google Play, and only Google Play. It runs
      # after the release above on purpose: the GitHub artefact and the
      # F-Droid submission are the primary channels, so a rejected upload
      # here must never be what makes a release fail.
      - name: Check for the Play credential
        id: play
        env:
          SERVICE_ACCOUNT: ${{ secrets.LISEUR_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "$SERVICE_ACCOUNT" ]]; then
            printf 'enabled=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
            printf 'No Play service account configured; skipping.\n'
          fi

      - name: Build the release bundle
        if: steps.play.outputs.enabled == 'true'
        run: ./gradlew bundleRelease --console=plain

      - name: Set up Ruby
        if: steps.play.outputs.enabled == 'true'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - name: Upload to the Play internal track
        if: steps.play.outputs.enabled == 'true'
        continue-on-error: true
        env:
          SERVICE_ACCOUNT: ${{ secrets.LISEUR_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/play-service-account.json"
          # The trap covers the failure paths too: the credential must not
          # outlive this step whatever fastlane makes of it.
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s' "$SERVICE_ACCOUNT" > "$key")
          gem install fastlane -v 2.238.0 --no-document
          SUPPLY_JSON_KEY="$key" fastlane android internal
