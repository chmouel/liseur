name: Release

# The tag is the trigger, not the GitHub release: a published release is
# immutable, so the APK has to be attached at the moment the release is
# created rather than uploaded to it afterwards.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

# One release at a time, so two tags pushed close together never hold
# Play edits open against each other. queue: max keeps every pending run;
# the default would cancel all but the newest one waiting.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Recovery uses this workflow while building the original tag.
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          # The notes are written from the commits since the previous
          # tag, so the whole history and every tag has to be here.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Check release version
        id: version
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]]
          version="${RELEASE_TAG#v}"
          grep -Fq "versionName = \"$version\"" app/build.gradle.kts
          version_code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)$/\1/p' \
            app/build.gradle.kts)
          # RCs are built and signed like final releases, but skip F-Droid.
          # The legacy test spelling remains recognizable so an old tag
          # cannot accidentally be treated as final.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(rc|test)\.[0-9]+$ ]]; then
            printf 'prerelease=true\n' >> "$GITHUB_OUTPUT"
            printf 'prerelease_kind=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'prerelease=false\n' >> "$GITHUB_OUTPUT"
            printf 'prerelease_kind=final\n' >> "$GITHUB_OUTPUT"
            test -s "fastlane/metadata/android/en-US/changelogs/$version_code.txt"
          else
            printf 'Unsupported release version: %s\n' "$version" >&2
            exit 1
          fi
          play_requested=true
          if [[ $(git cat-file -t "$RELEASE_TAG") == tag ]]; then
            tag_message=$(git for-each-ref --format='%(contents)' \
              "refs/tags/$RELEASE_TAG" | sed -n '1p')
            [[ "$tag_message" != 'release:no-play' ]] || play_requested=false
          fi
          printf 'play_requested=%s\n' "$play_requested" >> "$GITHUB_OUTPUT"
          printf 'version_code=%s\n' "$version_code" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.LISEUR_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LISEUR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LISEUR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LISEUR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/liseur-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      # The foss flavor: F-Droid rebuilds this exact APK and publishes our
      # signature over it, so it must carry nothing but free code.
      - name: Build signed release APK
        run: ./gradlew assembleFossRelease --console=plain

      - name: Verify release APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/foss/release/app-foss-release.apk"
          test -f "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-verification.txt"
          cat "$RUNNER_TEMP/apk-verification.txt"
          # Build tools use either numbered or scheme-specific signer labels.
          # The same certificate may be printed for more than one scheme.
          certificate_sha256=$(sed -nE 's/^(Signer #[0-9]+|V[0-9]+(\.[0-9]+)* Signer:) certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-verification.txt" | sort -u)
          if [[ ! "$certificate_sha256" =~ ^[[:xdigit:]]{64}$ ]]; then
            printf 'Expected one unique signing certificate SHA-256 digest.\n' >&2
            exit 1
          fi
          printf 'RELEASE_CERTIFICATE_SHA256=%s\n' "$certificate_sha256" >> "$GITHUB_ENV"
          release_apk="app/build/outputs/apk/foss/release/liseur-${RELEASE_TAG}.apk"
          mv "$apk" "$release_apk"
          printf 'RELEASE_APK=%s\n' "$release_apk" >> "$GITHUB_ENV"

      - name: Write the release notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PLAY_REQUESTED: ${{ steps.version.outputs.play_requested }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          PRERELEASE_KIND: ${{ steps.version.outputs.prerelease_kind }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          # Prereleases have no F-Droid changelog. Their commits are the
          # whole story, without generated prose.
          if [[ "$PRERELEASE" == true ]]; then
            previous=$(git describe --tags --abbrev=0 \
              --match 'v[0-9]*.[0-9]*.[0-9]*' \
              --exclude '*-rc.*' --exclude '*-test.*' \
              "$RELEASE_TAG^" 2>/dev/null || true)
            range="$RELEASE_TAG"
            [[ -z "$previous" ]] || range="$previous..$RELEASE_TAG"
            {
              if [[ "$PRERELEASE_KIND" == rc ]]; then
                printf 'A release candidate. It carries the release signature, so it\n'
              else
                printf 'A legacy test build. It carries the release signature, so it\n'
              fi
              printf 'installs over a copy that came from F-Droid, and F-Droid\n'
              printf 'updates over it once the next real release reaches it.\n\n'
              if [[ "$PLAY_REQUESTED" == true ]]; then
                printf 'The workflow will also try to put it on Google Play testing\n'
                printf 'tracks (Internal/Testing). It is not sent to F-Droid or\n'
                printf 'Google Play production.\n\n'
              else
                printf 'It is a GitHub prerelease, but is not on F-Droid or Google Play.\n\n'
              fi
              printf '### Commits%s\n\n' "${previous:+ since $previous}"
              git log --no-decorate --pretty='- %s' \
                --invert-grep \
                --grep='^chore: release candidate ' \
                --grep='^chore: test release ' \
                "$range"
            } > "$notes"
          else
            # hack/release writes and reviews them before tagging when it
            # can; generate them here only when the tag has none.
            prewritten="docs/release-notes/$RELEASE_TAG.md"
            if [[ -s "$prewritten" ]]; then
              cp "$prewritten" "$notes"
            else
              hack/generate-release-notes --output "$notes" "$RELEASE_TAG"
            fi
          fi
          fingerprint=$(printf '%s' "$RELEASE_CERTIFICATE_SHA256" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//')
          {
            printf '\n### Verify the APK\n\n'
            printf 'Package name and signing certificate SHA-256 fingerprint (for example using [AppVerifier](https://github.com/soupslurpr/AppVerifier)):\n\n'
            printf '```text\ncom.chmouel.liseur\n%s\n```\n\n' "$fingerprint"
            printf 'To verify the downloaded APK with Android SDK build tools:\n\n'
            printf '```sh\napksigner verify --print-certs liseur-%s.apk\n```\n\n' "$RELEASE_TAG"
          } >> "$notes"
          printf 'RELEASE_NOTES=%s\n' "$notes" >> "$GITHUB_ENV"
          cat "$notes"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Release %s already exists.\n' "$RELEASE_TAG"
            exit 0
          fi
          flags=()
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Liseur $RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES" \
            "${flags[@]}" \
            "$RELEASE_APK"

      - name: Prune obsolete prerelease pages
        if: steps.version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! hack/prune-prereleases; then
            printf '::warning::The prerelease was published, but old GitHub release pages could not be pruned.\n'
          fi

      # Everything below is Google Play, and only Google Play. It runs
      # after the release above on purpose: the GitHub artefact and the
      # F-Droid submission are the primary channels, so a rejected upload
      # here must never be what makes a release fail. The lane puts the
      # build on the internal track and then on the closed one testers
      # are recruited into. Final releases are also published to production;
      # see DEVELOPER.md for the channel boundaries.
      - name: Check for the Play credential
        id: play
        env:
          PLAY_REQUESTED: ${{ steps.version.outputs.play_requested }}
          SERVICE_ACCOUNT: ${{ secrets.LISEUR_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ "$PLAY_REQUESTED" != true ]]; then
            printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
            printf 'This tag opts out of Google Play; skipping.\n'
          elif [[ -n "$SERVICE_ACCOUNT" ]]; then
            printf 'enabled=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
            printf 'No Play service account configured; skipping.\n'
          fi

      - name: Build the release bundle
        if: steps.play.outputs.enabled == 'true'
        run: ./gradlew bundlePlayRelease --console=plain

      - name: Set up Ruby
        if: steps.play.outputs.enabled == 'true'
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"

      - name: Upload to the Play testing tracks
        if: steps.play.outputs.enabled == 'true'
        continue-on-error: true
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          PRERELEASE_KIND: ${{ steps.version.outputs.prerelease_kind }}
          SERVICE_ACCOUNT: ${{ secrets.LISEUR_PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/play-service-account.json"
          # The trap covers the failure paths too: the credential must not
          # outlive this step whatever fastlane makes of it.
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s' "$SERVICE_ACCOUNT" > "$key")
          changelog="fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
          if [[ "$PRERELEASE" == true && ! -f "$changelog" ]]; then
            if [[ "$PRERELEASE_KIND" == rc ]]; then
              printf 'Release candidate %s\n' "$RELEASE_TAG" > "$changelog"
            else
              printf 'Test release %s\n' "$RELEASE_TAG" > "$changelog"
            fi
          fi
          gem install fastlane -v 2.238.0 --no-document
          SUPPLY_JSON_KEY="$key" fastlane android internal

      - name: Publish the final release to the Play production track
        id: play_production
        if: steps.play.outputs.enabled == 'true' && steps.version.outputs.prerelease == 'false'
        continue-on-error: true
        env:
          SERVICE_ACCOUNT: ${{ secrets.LISEUR_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/play-production-service-account.json"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s' "$SERVICE_ACCOUNT" > "$key")
          SUPPLY_JSON_KEY="$key" fastlane android production \
            version_code:"${{ steps.version.outputs.version_code }}"

      # The listing is shared by every track, so its screenshots follow
      # production only: a release candidate must not advertise what the
      # store cannot install yet. Unchanged screenshots are a no-op, and a
      # failed sync is caught up by the next final release.
      - name: Sync the Play listing screenshots
        id: play_screenshots
        if: steps.play_production.outcome == 'success'
        continue-on-error: true
        env:
          SERVICE_ACCOUNT: ${{ secrets.LISEUR_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/play-screenshots-service-account.json"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s' "$SERVICE_ACCOUNT" > "$key")
          SUPPLY_JSON_KEY="$key" fastlane android screenshots \
            version_code:"${{ steps.version.outputs.version_code }}"

      - name: Report a failed screenshot sync
        if: steps.play_screenshots.outcome == 'failure'
        run: |
          message='The Play listing screenshots were not synced. Retry with: fastlane android screenshots version_code:${{ steps.version.outputs.version_code }}'
          printf '::warning::%s\n' "$message"
          printf '%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
