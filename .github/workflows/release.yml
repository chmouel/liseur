name: Release

# The tag is the trigger, not the GitHub release: a published release is
# immutable, so the APK has to be attached at the moment the release is
# created rather than uploaded to it afterwards.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]]
          version="${RELEASE_TAG#v}"
          grep -Fq "versionName = \"$version\"" app/build.gradle.kts
          version_code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)$/\1/p' \
            app/build.gradle.kts)
          notes="fastlane/metadata/android/en-US/changelogs/$version_code.txt"
          test -s "$notes"
          printf 'RELEASE_NOTES=%s\n' "$notes" >> "$GITHUB_ENV"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.LISEUR_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LISEUR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LISEUR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LISEUR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/liseur-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Verify release APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          release_apk="app/build/outputs/apk/release/liseur-${RELEASE_TAG}.apk"
          mv "$apk" "$release_apk"
          printf 'RELEASE_APK=%s\n' "$release_apk" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Release %s already exists.\n' "$RELEASE_TAG"
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Liseur $RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES" \
            "$RELEASE_APK"
