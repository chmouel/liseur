name: Nightly

# Cuts a signed nightly prerelease from main when something that ships
# changed since the last one. hack/release --nightly decides, bumps and
# tags; release.yml builds and publishes, as it does for a pushed tag.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Cut a nightly even if nothing that ships changed
        type: boolean
        default: false

permissions:
  contents: read

# Not `release`: release.yml takes that group itself once called, and a
# caller holding the same group would deadlock with it.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the nightly
    if: github.repository == 'chmouel/liseur'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Verify the source commit
        run: >-
          ./gradlew testFossDebugUnitTest testPlayDebugUnitTest
          lintFossDebug lintPlayDebug assembleFossDebug assemblePlayDebug
          assembleFossRelease assemblePlayRelease --console=plain

      - name: Tag it
        id: cut
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          args=(--nightly)
          [[ "$FORCE" != true ]] || args+=(--force)
          tag=$(hack/release "${args[@]}")
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          if [[ -n "$tag" ]]; then
            printf 'Publishing %s.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Nothing that ships changed; no nightly.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
