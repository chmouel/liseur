name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` so adding the full-ci label starts the full build at once.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.full.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify release tag policy
        run: |
          bash -n hack/release hack/verify-fdroid-tags hack/test-fdroid-tags \
            hack/prune-prereleases hack/test-prune-prereleases hack/test-release-allocation
          hack/test-fdroid-tags
          hack/test-prune-prereleases
          hack/test-release-allocation
          hack/test-store-images
          hack/test-ai-stub
          hack/test-openai-voices

      # Tests, lint and builds run locally and in the pre-push hook, so
      # pull requests only get the quick checks above: skipping the full
      # jobs still lets the required `build` aggregator check report.
      # The full build runs on push to main, and on a pull request that
      # carries the full-ci label.
      - name: Check for Android/Gradle changes
        id: changes
        if: github.event_name != 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            android:
              - 'app/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '*.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/build.yml'

      - name: Decide on the full build
        id: full
        if: >-
          steps.changes.outputs.android == 'true' ||
          (
            contains(github.event.pull_request.labels.*.name, 'full-ci') &&
            (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
          )
        run: echo "run=true" >> "$GITHUB_OUTPUT"

  unit-tests:
    needs: policy
    if: needs.policy.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Cache Robolectric SDK jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Unit tests
        run: ./gradlew testFossDebugUnitTest testPlayDebugUnitTest --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore

  lint:
    needs: policy
    if: needs.policy.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Lint
        run: |
          ./gradlew lintFossDebug --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx5120m -Dfile.encoding=UTF-8" --console=plain
          ./gradlew lintPlayDebug --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx5120m -Dfile.encoding=UTF-8" --console=plain

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-fossDebug.html
            app/build/reports/lint-results-playDebug.html
          if-no-files-found: ignore

  assemble:
    needs: policy
    if: needs.policy.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Assemble debug APKs
        run: ./gradlew assembleFossDebug assemblePlayDebug --console=plain

      # The release build is the one people install, and it is the only
      # one that runs R8. Building it on main means a rule that strips
      # something Readium reflects on is caught before the evening a tag
      # is cut. Unsigned without a keystore, which is fine: the point is
      # that it builds and shrinks.
      - name: Assemble release APKs
        run: |
          ./gradlew --stop
          ./gradlew assembleFossRelease --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx5120m -Dfile.encoding=UTF-8" --console=plain
          ./gradlew assemblePlayRelease --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx5120m -Dfile.encoding=UTF-8" --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: liseur-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk

  # Required status check on main (ruleset `Main`). Keeps one stable
  # check name whether only `policy` ran or all full-build jobs ran.
  build:
    needs: [policy, unit-tests, lint, assemble]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify build status
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          FULL: ${{ needs.policy.outputs.full }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          ASSEMBLE_RESULT: ${{ needs.assemble.result }}
        run: |
          set -euo pipefail
          [[ "$POLICY_RESULT" == "success" ]] || { echo "policy: $POLICY_RESULT"; exit 1; }
          if [[ "$FULL" == "true" ]]; then
            for name in UNIT_TESTS_RESULT LINT_RESULT ASSEMBLE_RESULT; do
              if [[ "${!name}" != "success" ]]; then
                echo "$name: ${!name}"
                exit 1
              fi
            done
          fi
