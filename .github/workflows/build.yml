name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify release tag policy
        run: |
          bash -n hack/release hack/verify-fdroid-tags hack/test-fdroid-tags \
            hack/prune-prereleases hack/test-prune-prereleases
          hack/test-fdroid-tags
          hack/test-prune-prereleases

      # Tests, lint and builds run locally and in the pre-push hook, so
      # pull requests only get the quick checks above: skipping this step
      # skips every Gradle step, and the required `build` check still
      # reports. The full build runs on push to main.
      - name: Check for Android/Gradle changes
        id: changes
        if: github.event_name != 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            android:
              - 'app/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '*.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/build.yml'

      - name: Set up JDK 17
        if: steps.changes.outputs.android == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Unit tests
        if: steps.changes.outputs.android == 'true'
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Lint
        if: steps.changes.outputs.android == 'true'
        run: ./gradlew lintDebug --console=plain

      - name: Assemble debug APK
        if: steps.changes.outputs.android == 'true'
        run: ./gradlew assembleDebug --console=plain

      # The release build is the one people install, and it is the only
      # one that runs R8. Building it on main means a rule that strips
      # something Readium reflects on is caught before the evening a tag
      # is cut. Unsigned without a keystore, which is fine: the point is
      # that it builds and shrinks.
      - name: Assemble release APK
        if: steps.changes.outputs.android == 'true'
        run: ./gradlew assembleRelease --console=plain

      - name: Upload debug APK
        if: steps.changes.outputs.android == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: liseur-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test/lint reports
        if: always() && steps.changes.outputs.android == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
