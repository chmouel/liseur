name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` so adding the full-ci label starts the full build at once.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify release tag policy
        run: |
          bash -n hack/release hack/verify-fdroid-tags hack/test-fdroid-tags \
            hack/prune-prereleases hack/test-prune-prereleases hack/test-release-allocation
          hack/test-fdroid-tags
          hack/test-prune-prereleases
          hack/test-release-allocation
          hack/test-store-images
          hack/test-ai-stub
          hack/test-openai-voices

      # Tests, lint and builds run locally and in the pre-push hook, so
      # pull requests only get the quick checks above: skipping this step
      # skips every Gradle step, and the required `build` check still
      # reports. The full build runs on push to main, and on a pull
      # request that carries the full-ci label.
      - name: Check for Android/Gradle changes
        id: changes
        if: github.event_name != 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            android:
              - 'app/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '*.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/build.yml'

      - name: Decide on the full build
        id: full
        if: >-
          steps.changes.outputs.android == 'true' ||
          (
            contains(github.event.pull_request.labels.*.name, 'full-ci') &&
            (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
          )
        run: echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.full.outputs.run == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.full.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Unit tests
        if: steps.full.outputs.run == 'true'
        run: ./gradlew testFossDebugUnitTest testPlayDebugUnitTest --console=plain

      - name: Lint
        if: steps.full.outputs.run == 'true'
        run: ./gradlew lintFossDebug lintPlayDebug --console=plain

      - name: Assemble debug APKs
        if: steps.full.outputs.run == 'true'
        run: ./gradlew assembleFossDebug assemblePlayDebug --console=plain

      # The release build is the one people install, and it is the only
      # one that runs R8. Building it on main means a rule that strips
      # something Readium reflects on is caught before the evening a tag
      # is cut. Unsigned without a keystore, which is fine: the point is
      # that it builds and shrinks.
      - name: Assemble release APKs
        if: steps.full.outputs.run == 'true'
        run: ./gradlew assembleFossRelease assemblePlayRelease --console=plain

      - name: Upload debug APK
        if: steps.full.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: liseur-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk

      - name: Upload test/lint reports
        if: always() && steps.full.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-fossDebug.html
            app/build/reports/lint-results-playDebug.html
          if-no-files-found: ignore
